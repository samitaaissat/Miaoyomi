name: miaoyomi

services:
  app:
    image: miaoyomi/app:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.miaoyomi
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Run scripts/miaoyomi-setup.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/miaoyomi-setup.sh first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PUID: ${PUID:-10002}
      PGID: ${PGID:-10002}
      LIBRARY_BACKEND: owned
      LIBRARY_ROOT: /library
      DL_ROOT: /library-dl
      NOVEL_LIBRARY_PATH: /novels
      NOVEL_ENGINE_URL: http://novel-engine:4100
      NOVEL_ENGINE_TOKEN: ${NOVEL_ENGINE_TOKEN:?Run scripts/miaoyomi-setup.sh first}
      SUWAYOMI_URL: http://suwayomi:4567
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      CONFIG_DIR: /config
      CACHE_DIR: /cache
      BACKUP_DIR: /backups
      TZ: UTC
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:3000"
    volumes:
      - ${MANGA_LIBRARY_PATH:-./data/manga}:/library:ro
      - ${MANGA_DOWNLOAD_PATH:-./data/downloaded-manga}:/library-dl
      - ${NOVEL_LIBRARY_PATH:-./data/novels}:/novels
      - app_config:/config
      - app_cache:/cache
      - app_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      novel-engine:
        condition: service_healthy
      suwayomi:
        condition: service_started
    networks: [app, database, novel, manga]

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      POSTGRES_USER: miaoyomi
      POSTGRES_DB: miaoyomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/miaoyomi-setup.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U miaoyomi -d miaoyomi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [database]

  novel-engine:
    image: miaoyomi/novel-engine:local
    platform: linux/amd64
    build:
      context: ./novel-engine
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    environment:
      PORT: "4100"
      NOVEL_ENGINE_TOKEN: ${NOVEL_ENGINE_TOKEN:?Run scripts/miaoyomi-setup.sh first}
      NOVEL_ENGINE_STATE_DIR: /state
      NOVEL_ENGINE_ALLOWED_ORIGINS: ${NOVEL_ENGINE_ALLOWED_ORIGINS:-}
    volumes:
      - novel_engine:/state
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    networks: [novel]

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243@sha256:e59f212ccf91b26de8676a063a2db90256c148c6261535c7c477d47a43d9751b
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      TZ: UTC
      AUTO_DOWNLOAD_CHAPTERS: "false"
      DOWNLOAD_AS_CBZ: "true"
    volumes:
      - suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks: [manga]
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/4567"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  solver:
    profiles: [solver]
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 2g
    environment:
      LOG_LEVEL: warning
    networks: [manga]

networks:
  app:
  database:
    internal: true
  novel:
  manga:

volumes:
  database:
  app_config:
  app_cache:
  app_backups:
  novel_engine:
  suwayomi:
