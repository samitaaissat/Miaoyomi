name: Publish Miaoyomi images

# Each architecture is built natively, then the resulting digests are merged into one OCI index. Building
# the app's native Node modules under QEMU has been unreliable, so do not replace the arm64 runner with an
# emulator. `latest` moves only after both images have verified two-architecture indexes.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGES: >-
    ghcr.io/${{ github.repository_owner }}/miaoyomi
    ghcr.io/${{ github.repository_owner }}/miaoyomi-novel-engine

jobs:
  prepare:
    name: normalize image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - id: tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$REF_NAME" | LC_ALL=C sed 's/[^A-Za-z0-9_.-]/-/g' | sed 's/^[.-]*//; s/[-.]*$//; s/--*/-/g')"
          if [[ -z "$tag" ]]; then tag="build-${GITHUB_SHA:0:12}"; fi
          tag="${tag:0:128}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || { echo "invalid Docker tag: $tag" >&2; exit 1; }
          printf 'image_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [app, novel-engine]
        arch: [amd64, arm64]
        include:
          - service: app
            image: ghcr.io/${{ github.repository_owner }}/miaoyomi
            context: .
            file: ./Dockerfile.miaoyomi
          - service: novel-engine
            image: ghcr.io/${{ github.repository_owner }}/miaoyomi-novel-engine
            context: ./novel-engine
            file: ./novel-engine/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }} for ${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=miaoyomi-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=miaoyomi-${{ matrix.service }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Miaoyomi ${{ matrix.service }}
            org.opencontainers.image.description=Self-hosted manga and webnovel PWA
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MPL-2.0
      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.service }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    name: merge ${{ matrix.service }}
    needs: [build, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image: ghcr.io/${{ github.repository_owner }}/miaoyomi
          - service: novel-engine
            image: ghcr.io/${{ github.repository_owner }}/miaoyomi-novel-engine
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Write ${{ matrix.image }}:$IMAGE_TAG over both architectures
        id: index
        run: |
          set -euo pipefail
          refs=""
          for f in digests/${{ matrix.service }}-*; do refs="$refs ${{ matrix.image }}@$(cat "$f")"; done
          docker buildx imagetools create -t "${{ matrix.image }}:$IMAGE_TAG" $refs
          out=$(docker buildx imagetools inspect "${{ matrix.image }}:$IMAGE_TAG")
          printf '%s\n' "$out"
          for arch in amd64 arm64; do
            grep -q "linux/$arch" <<<"$out" \
              || { echo "::error::${{ matrix.image }}:$IMAGE_TAG has no linux/$arch"; exit 1; }
          done
          digest=$(awk '/^Digest:/ && !d {print $2; d=1}' <<<"$out")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  latest:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [merge, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Point latest at $IMAGE_TAG
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            docker buildx imagetools create -t "$image:latest" "$image:$IMAGE_TAG"
          done
      - name: Verify latest points to the matching release index
        run: |
          set -euo pipefail
          digest_of() { local out; out=$(docker buildx imagetools inspect "$1"); awk '/^Digest:/ && !d {print $2; d=1}' <<<"$out"; }
          for image in $IMAGES; do
            version=$(digest_of "$image:$IMAGE_TAG")
            latest=$(digest_of "$image:latest")
            echo "$image version=$version latest=$latest"
            [ -n "$version" ] && [ "$version" = "$latest" ] || { echo "::error::$image latest does not match $IMAGE_TAG"; exit 1; }
          done
